version: '3.8'

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: member2-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  neo4j:
    image: neo4j:5.18.0-community
    container_name: member2-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/csvgraphdb
      NEO4J_initial_dbms_default__database: CSV_Graph_DB
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p csvgraphdb -d CSV_Graph_DB 'RETURN 1' || cypher-shell -u neo4j -p csvgraphdb 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: member2-api
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: csv-rows
      KAFKA_CLIENT_ID: member2-api
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: csvgraphdb
      NEO4J_DATABASE: CSV_Graph_DB
      MAX_UPLOAD_BYTES: 52428800
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
